<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A86FF" />
      <stop offset="60%" stop-color="#0043A8" />
      <stop offset="100%" stop-color="#001845" />
    </radialGradient>
  </defs>

  <!-- Left Eye -->
  <g id="leftEye">
    <!-- Sclera -->
    <ellipse cx="50" cy="40" rx="22" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Iris -->
    <ellipse cx="52" cy="40" rx="12" ry="12" fill="url(#irisGrad)" />
    <!-- Pupil -->
    <circle cx="52" cy="40" r="6" fill="#0B090A" />
    <!-- Highlights -->
    <circle cx="48" cy="36" r="3.5" fill="#FFFFFF" />
    <circle cx="55" cy="43" r="1.5" fill="#FFFFFF" opacity="0.8" />
    <!-- Upper eyelid contour -->
    <path d="M 28 38 Q 50 20 72 38" fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Right Eye -->
  <g id="rightEye">
    <!-- Sclera -->
    <ellipse cx="150" cy="40" rx="22" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Iris -->
    <ellipse cx="148" cy="40" rx="12" ry="12" fill="url(#irisGrad)" />
    <!-- Pupil -->
    <circle cx="148" cy="40" r="6" fill="#0B090A" />
    <!-- Highlights -->
    <circle cx="144" cy="36" r="3.5" fill="#FFFFFF" />
    <circle cx="151" cy="43" r="1.5" fill="#FFFFFF" opacity="0.8" />
    <!-- Upper eyelid contour -->
    <path d="M 128 38 Q 150 20 172 38" fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
