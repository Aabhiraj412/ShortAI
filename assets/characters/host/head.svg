<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Skin gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0B892" />
    </linearGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2D42" />
      <stop offset="100%" stop-color="#1A1B28" />
    </linearGradient>
    <!-- Ear shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Neck -->
  <path d="M 160 270 L 160 360 L 240 360 L 240 270 Z" fill="url(#skinGrad)" />
  <path d="M 160 270 Q 200 295 240 270 L 240 290 Q 200 315 160 290 Z" fill="#D99B75" opacity="0.6"/>

  <!-- Ears -->
  <ellipse cx="108" cy="205" rx="18" ry="26" fill="url(#skinGrad)" />
  <ellipse cx="109" cy="205" rx="10" ry="16" fill="#D99B75" opacity="0.5"/>
  <ellipse cx="292" cy="205" rx="18" ry="26" fill="url(#skinGrad)" />
  <ellipse cx="291" cy="205" rx="10" ry="16" fill="#D99B75" opacity="0.5"/>

  <!-- Face Contour -->
  <path d="M 120 160 C 115 250, 145 310, 200 310 C 255 310, 285 250, 280 160 C 280 90, 120 90, 120 160 Z" 
        fill="url(#skinGrad)" filter="url(#softShadow)" />

  <!-- Nose -->
  <path d="M 197 195 Q 192 215 188 220 Q 200 223 205 218" 
        fill="none" stroke="#D99B75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cheeks blush -->
  <circle cx="145" cy="225" r="14" fill="#FF8A8A" opacity="0.25" />
  <circle cx="255" cy="225" r="14" fill="#FF8A8A" opacity="0.25" />

  <!-- Modern Hair Style -->
  <path d="M 115 155 C 105 100, 140 50, 200 45 C 265 40, 295 85, 285 145 C 275 125, 255 110, 220 115 C 180 120, 160 135, 135 150 C 125 155, 118 158, 115 155 Z" 
        fill="url(#hairGrad)" />
  <!-- Hair volume detail tufts -->
  <path d="M 140 85 C 170 55, 230 50, 270 75 C 250 65, 210 60, 175 75 Z" fill="#3D405B" opacity="0.6"/>
</svg>
