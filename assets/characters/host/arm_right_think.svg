<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 400" width="250" height="400">
  <defs>
    <linearGradient id="armJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2235" />
      <stop offset="100%" stop-color="#0E101A" />
    </linearGradient>
    <linearGradient id="skinArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0B892" />
    </linearGradient>
  </defs>

  <!-- Right Arm Bent Upward toward Chin (Thinking) -->
  <path d="M 40 50 Q 80 160 110 220 L 70 240 Q 40 180 10 50 Z" fill="url(#armJacket)" stroke="#2B2D42" stroke-width="2.5" />
  <!-- Forearm reaching up to chin -->
  <path d="M 110 220 L 150 120 L 180 130 L 130 250 Z" fill="url(#armJacket)" />
  <!-- Cuff -->
  <path d="M 150 120 L 180 130 L 185 118 L 155 108 Z" fill="#2E3349" />
  <!-- Hand at chin / index finger extended -->
  <path d="M 160 110 C 160 85, 175 75, 185 75 C 190 75, 195 85, 185 105 C 195 95, 205 105, 195 115 C 190 125, 170 120, 160 110 Z" fill="url(#skinArm)" />
</svg>
