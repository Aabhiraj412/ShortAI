[pytest]
# Test levels (see CLAUDE.md "Tests" and backend/scripts/select_tests.py):
#   FAST     python backend/scripts/select_tests.py --level fast --run      (changed modules + essentials, not slow)
#   RELATED  python backend/scripts/select_tests.py --level related --run   (changed modules, their dependants, slow incl.)
#   FULL     the whole suite (backend/tests), serial
markers =
    slow: renders real media or runs a long real pipeline (excluded from the FAST level, always in RELATED and FULL)

# Temporary directories stay in pytest's own numbered folders (%TEMP%\pytest-of-<user>\pytest-N; pytest deletes only
# those, never anything else). Keep the last 3 sessions, and inside them only the directories of FAILED tests: passed
# tests' tmp_path contents are removed when the session ends, failures stay for debugging. Before this the 3 kept
# sessions held every test's files (5.2 GB) and each new session spent ~10 s deleting the oldest.
tmp_path_retention_count = 3
tmp_path_retention_policy = failed
